<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=380">
<title>DeadlinePinPK</title>
<style>
  :root {
    --violet: #7c3aed; --violet-d: #6d28d9; --violet-l: #f3edff;
    --ink: #1c1530; --mute: #6b6580; --line: #e8e4f1; --bg: #ffffff;
    --green: #16a34a; --green-bg: #dcfce7; --yellow: #ca8a04; --yellow-bg: #fef9c3; --yellow-line: #facc15;
    --red: #dc2626; --red-bg: #fee2e2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 380px; height: 520px; background: var(--bg); color: var(--ink);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button { font: inherit; cursor: pointer; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; }
  header h1 { margin: 0; font-size: 17px; letter-spacing: -.2px; }
  .icon-btn { border: 0; background: transparent; font-size: 17px; padding: 4px 6px; border-radius: 8px; color: var(--mute); }
  .icon-btn:hover { background: var(--violet-l); color: var(--violet); }

  .add { display: flex; gap: 6px; padding: 0 14px 8px; }
  .add input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font: inherit; }
  .add input:focus, .edit input:focus { outline: 2px solid var(--violet); outline-offset: -1px; border-color: transparent; }
  .add button { border: 0; background: var(--violet); color: #fff; border-radius: 10px; padding: 0 12px; font-weight: 600; }
  .add button:hover { background: var(--violet-d); }

  nav { display: flex; gap: 4px; padding: 0 14px 8px; border-bottom: 1px solid var(--line); }
  nav button {
    flex: 1; border: 0; background: transparent; padding: 6px 4px; border-radius: 8px; color: var(--mute); font-weight: 600;
    transition: background 150ms, color 150ms;
  }
  nav button:hover { background: var(--violet-l); }
  nav button[aria-selected="true"], nav button[aria-selected="true"]:hover { background: var(--violet); color: #fff; }
  nav .n { font-weight: 500; opacity: .8; margin-left: 3px; font-size: 12px; }

  #list { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
  .empty { margin: auto; text-align: center; color: var(--mute); padding: 0 24px; }
  .empty .big { font-size: 36px; display: block; margin-bottom: 6px; }

  .card {
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff;
    transition: box-shadow 150ms, border-color 150ms, transform 150ms; touch-action: pan-y; user-select: none;
  }
  .card:hover { box-shadow: 0 2px 10px rgba(76, 29, 149, .1); }
  .card.low { border-color: var(--yellow-line); background: #fffdf0; }
  .card.done .title { text-decoration: line-through; color: var(--mute); }
  .card.overdue .when { color: var(--red); }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .main { flex: 1; min-width: 0; cursor: pointer; }
  .title { font-weight: 700; overflow-wrap: anywhere; }
  .when { color: var(--ink); font-size: 13px; margin-top: 1px; }
  .when .rel { color: var(--violet); font-weight: 600; }
  .meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 12px; color: var(--mute); flex-wrap: wrap; }
  .meta img { width: 14px; height: 14px; border-radius: 3px; }
  .meta .host { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .b-high { background: var(--green-bg); color: var(--green); }
  .b-medium { background: var(--yellow-bg); color: var(--yellow); }
  .b-low { background: var(--red-bg); color: var(--red); }
  .check { color: var(--yellow); font-weight: 700; font-size: 12px; }
  .actions { display: flex; flex-direction: column; gap: 4px; }
  .actions button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 3px 8px; font-size: 12px; white-space: nowrap; }
  .actions .ok:hover { background: var(--green-bg); border-color: var(--green); color: var(--green); }
  .actions .del:hover { background: var(--red-bg); border-color: var(--red); color: var(--red); }

  .details { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 150ms ease; }
  .card.open .details { grid-template-rows: 1fr; }
  .details > div { overflow: hidden; }
  .orig { margin-top: 8px; padding: 8px 10px; background: var(--violet-l); border-radius: 8px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
  .orig a { color: var(--violet); }
  .link-row { margin-top: 6px; display: flex; gap: 8px; align-items: center; }
  .link-row button { border: 0; background: transparent; color: var(--violet); font-weight: 600; padding: 2px 0; }
  .edit { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .edit input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; min-width: 0; }
  .edit .full { grid-column: 1 / -1; }
  .edit .btns { grid-column: 1 / -1; display: flex; gap: 6px; justify-content: flex-end; }
  .edit .btns button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 12px; }
  .edit .btns .save { background: var(--violet); color: #fff; border-color: var(--violet); font-weight: 600; }

  footer { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: #fff; position: relative; }
  footer button { flex: 1; border-radius: 10px; padding: 9px 8px; font-weight: 600; border: 1px solid var(--line); background: #fff; }
  footer .primary { background: var(--violet); border-color: var(--violet); color: #fff; }
  footer .primary:hover { background: var(--violet-d); }
  footer button:not(.primary):hover { background: var(--violet-l); }
  #status {
    position: absolute; left: 14px; right: 14px; bottom: 58px; background: #1f1637; color: #fff; border-radius: 10px;
    padding: 8px 12px; font-size: 13px; opacity: 0; transform: translateY(6px); transition: opacity 150ms, transform 150ms; pointer-events: none;
  }
  #status.show { opacity: 1; transform: none; }
</style>
</head>
<body>
  <header>
    <h1>📌 DeadlinePinPK</h1>
    <button class="icon-btn" id="gear" title="Settings (optional AI key)" aria-label="Settings">⚙️</button>
  </header>
  <form class="add" id="addForm">
    <input id="addInput" placeholder="Paste a message: quiz kal 9 baje…" autocomplete="off" aria-label="Add a deadline from text">
    <button type="submit">Pin</button>
  </form>
  <nav id="tabs" role="tablist">
    <button role="tab" data-tab="all">All<span class="n"></span></button>
    <button role="tab" data-tab="today">Today<span class="n"></span></button>
    <button role="tab" data-tab="week">This Week<span class="n"></span></button>
    <button role="tab" data-tab="done">Done<span class="n"></span></button>
  </nav>
  <main id="list" aria-live="polite"></main>
  <footer>
    <div id="status" role="status"></div>
    <button class="primary" id="exportBtn">Export .ics</button>
    <button id="clearBtn">Clear Done</button>
  </footer>
  <script src="core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
